name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        shell: bash
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > /tmp/sa.json
          set +e
          OUTPUT=$(npx firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT_ID" 2>&1)
          RESULT=$?
          echo "$OUTPUT"
          set -e
          if [ "$RESULT" -ne 0 ] && echo "$OUTPUT" | grep -q "current active version"; then
            echo "コンテンツ未変更のためデプロイをスキップしました"
            exit 0
          fi
          rm -f /tmp/sa.json
          exit "$RESULT"
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
