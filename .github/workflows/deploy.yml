name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ブラウザテストは deploy とは別ジョブにして、並列に走らせる。
  #
  # **deploy は needs でこのジョブに依存させない = 落ちてもデプロイを止めない。**
  # 理由は2つ。
  # (1) Chromium のダウンロードと apt を挟むので、外的要因で失敗しうる経路が増える。
  #     防災アプリの公開が、UIテストの環境差やネットワークの不調で止まるのは本末転倒。
  # (2) ブラウザテストが守っているのはフォーカス・ARIA・マーカーの実寸といったUIの質で、
  #     スコア計算や気象庁データのパースではない。後者は deploy 側の npm test が守る。
  #
  # 失敗すればコミットに赤いチェックが付くので気づける。Linux ランナーでの挙動が
  # 十分に安定したと判断できたら、deploy に `needs: browser-tests` を足してゲートに昇格させる。
  browser-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ダウンロードだけキャッシュする（--with-deps の apt はキャッシュされない）
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # --omit=dev を付けないこと。adapter-static も svelte/vite も devDependencies にあり、
      # ビルドに必要（dependencies は実際にバンドルされる leaflet だけ）
      - name: Install dependencies
        run: npm ci

      # 速いものから順に並べて、失敗を早く出す
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      # npm test はロジック層のみ（vitest.config.ts で browser/live を除外している）。
      # スコア計算・気象庁データのパースはここで守る —— 壊れたらデプロイしない
      - name: Run tests
        run: npm test

      # ブラウザテスト（*.browser.test.ts）はこのジョブに入れない。browser-tests ジョブ参照。
      # npm run verify:jma もここに入れないこと —— 実APIを叩くので、
      # 気象庁側の不調でデプロイが止まる。あれは人が回して結果を見るもの

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        shell: bash
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > /tmp/sa.json
          set +e
          OUTPUT=$(npx firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT_ID" 2>&1)
          RESULT=$?
          echo "$OUTPUT"
          set -e
          if [ "$RESULT" -ne 0 ] && echo "$OUTPUT" | grep -q "current active version"; then
            echo "コンテンツ未変更のためデプロイをスキップしました"
            exit 0
          fi
          rm -f /tmp/sa.json
          exit "$RESULT"
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
