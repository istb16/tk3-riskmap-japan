<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    OGP 画像の元。SNS は SVG を表示しないので、ここから static/ogp.png（1200×630）を
    書き出して og:image にはそちらを指す（npm run ogp）。
    色と書体は tk3 apps base（src/lib/styles/tk-base.css）の明るい配色に合わせる。
  -->
  <rect width="1200" height="630" fill="#F6F7F9"/>

  <!-- 面（.tk-panel と同じ白・線・影） -->
  <rect x="56" y="58" width="1088" height="514" rx="28" fill="#000000" opacity="0.05"/>
  <rect x="56" y="54" width="1088" height="514" rx="28" fill="#FFFFFF" stroke="#D9DCE3" stroke-width="2"/>

  <!-- アプリのアイコン（static/icon.svg と同じ図形・色） -->
  <svg x="104" y="172" width="288" height="288" viewBox="0 0 48 48">
    <path d="M6 34a18 18 0 0 1 5.3-12.7" fill="none" stroke="#2FA25A" stroke-width="7" stroke-linecap="round"/>
    <path d="M16.5 17.6a18 18 0 0 1 15 0" fill="none" stroke="#F6B820" stroke-width="7" stroke-linecap="round"/>
    <path d="M36.7 21.3A18 18 0 0 1 42 34" fill="none" stroke="#E5483B" stroke-width="7" stroke-linecap="round"/>
    <path d="M24 34 33 22" stroke="#3B7CF0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="24" cy="34" r="5" fill="#3B7CF0"/>
  </svg>

  <g font-family="'Noto Sans JP', 'Yu Gothic UI', 'Hiragino Sans', Meiryo, sans-serif">
    <text x="440" y="236" font-size="72" font-weight="700" fill="#1B1C20" letter-spacing="1">JAPAN RISK MAP</text>
    <rect x="442" y="272" width="96" height="6" rx="3" fill="#C5221F"/>
    <text x="440" y="346" font-size="32" font-weight="700" fill="#1B1C20">日本全国64地域のリアルタイム危険スコア</text>
    <text x="440" y="398" font-size="26" font-weight="400" fill="#676B76">気象・地震・津波・火山・大気を 0〜100 で統合</text>
  </g>

  <!-- 危険度の帯（アプリの明るい配色の色） -->
  <g font-family="'Noto Sans JP', 'Yu Gothic UI', 'Hiragino Sans', Meiryo, sans-serif" font-size="22" font-weight="700">
    <circle cx="451" cy="470" r="9" fill="#1A7340"/>
    <text x="468" y="478" fill="#1A7340">平穏</text>
    <circle cx="551" cy="470" r="11" fill="#8A6100"/>
    <text x="570" y="478" fill="#8A6100">注意</text>
    <circle cx="655" cy="470" r="13" fill="#C2410C"/>
    <text x="676" y="478" fill="#C2410C">警戒</text>
    <circle cx="763" cy="470" r="15" fill="#B91C1C"/>
    <text x="786" y="478" fill="#B91C1C">危険</text>
  </g>

  <text x="1096" y="530" text-anchor="end" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="22" fill="#676B76">riskmap.tk3.biz</text>
</svg>
